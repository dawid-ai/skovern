name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: nothing in CI needs to write to the repo (SEC-046 hardening 5).
permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # SEC-046-1: @dawid-ai/model-fit runs in the main process, so every version (and every
      # Dependabot bump) must prove it was built by its own repo's publish workflow from its tag.
      # It reads only the lockfile, so it runs before install: no code from an unverified version
      # runs first.
      - name: Verify @dawid-ai/model-fit provenance and purity
        run: node scripts/verify-model-fit.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      # Skovern stores keys and sessions only through the OS keychain (safeStorage) and refuses
      # when there is none, so the runner needs a real Secret Service: gnome-keyring in its own
      # D-Bus session, unlocked with a throwaway password. Never `--password-store=basic`.
      - name: Install a keychain for safeStorage
        run: sudo apt-get update -q && sudo apt-get install -y -q gnome-keyring dbus-x11
      - name: Probe safeStorage (diagnostic)
        env:
          XDG_CURRENT_DESKTOP: GNOME
        working-directory: apps/desktop
        run: |
          cat > /tmp/idle.cjs <<"JS"
          require("electron").app.setName("Skovern");
          JS
          cat > ./pw-probe.mjs <<"JS"
          import { _electron as electron } from "@playwright/test";
          const ask = ({ safeStorage }) => {
            let rt;
            try { rt = safeStorage.decryptString(safeStorage.encryptString("hi")) === "hi"; } catch (e) { rt = "error: " + e.message; }
            return { backend: safeStorage.getSelectedStorageBackend?.(), available: safeStorage.isEncryptionAvailable(), rt };
          };
          for (const [label, args] of [["idle-script", ["/tmp/idle.cjs"]], ["real-app", [".", "--user-data-dir=/tmp/pw-ud"]]]) {
            const app = await electron.launch({ args, env: { ...process.env } });
            try {
              await app.firstWindow({ timeout: 15000 }).catch(() => {});
              console.log("PROBE pw " + label + " " + JSON.stringify(await app.evaluate(ask)));
            } catch (e) { console.log("PROBE pw " + label + " failed: " + e.message); }
            await app.close().catch(() => {});
          }
          JS
          pnpm exec electron-vite build > /dev/null
          dbus-run-session -- bash -ec "
            echo -n ci | gnome-keyring-daemon --unlock --components=secrets > /dev/null
            xvfb-run -a node ./pw-probe.mjs || true
          "
      - name: Test (unit + E2E under xvfb)
        env:
          XDG_CURRENT_DESKTOP: GNOME
        run: |
          dbus-run-session -- bash -ec '
            echo -n ci | gnome-keyring-daemon --unlock --components=secrets > /dev/null
            xvfb-run -a pnpm test
          '
      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high
