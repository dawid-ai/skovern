name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # SEC-046-1: @dawid-ai/model-fit runs in the main process, so every version (and every
      # Dependabot bump) must prove it was built by its own repo's publish workflow from its tag.
      - name: Verify @dawid-ai/model-fit provenance and purity
        run: node scripts/verify-model-fit.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test (unit + E2E under xvfb)
        run: xvfb-run -a pnpm test
      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high
