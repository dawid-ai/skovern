name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: nothing in CI needs to write to the repo (SEC-046 hardening 5).
permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    env:
      # The www build must not phone home (Astro's anonymous usage stats).
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # SEC-046-1: @dawid-ai/model-fit runs in the main process, so every version (and every
      # Dependabot bump) must prove it was built by its own repo's publish workflow from its tag.
      # It reads only the lockfile, so it runs before install: no code from an unverified version
      # runs first.
      - name: Verify @dawid-ai/model-fit provenance and purity
        run: node scripts/verify-model-fit.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      # Skovern stores keys and sessions only through the OS keychain (safeStorage) and refuses
      # when there is none, so the runner needs a real Secret Service: gnome-keyring in its own
      # D-Bus session, unlocked with a throwaway password. Playwright's Electron launcher forces
      # `--password-store=basic` (no encryption on Linux); SKOVERN_PASSWORD_STORE, an unpackaged
      # seam in the main process, selects gnome-libsecret over it.
      - name: Install a keychain for safeStorage
        run: sudo apt-get update -q && sudo apt-get install -y -q gnome-keyring dbus
      # The www e2e (W2) drives a real Chromium against astro preview and a local api.
      - name: Install Chromium for the www e2e
        run: pnpm --filter @skovern/www exec playwright install --with-deps chromium
      - name: Test (unit + E2E under xvfb)
        env:
          SKOVERN_PASSWORD_STORE: gnome-libsecret
        run: |
          dbus-run-session -- bash -ec '
            echo -n ci | gnome-keyring-daemon --unlock --components=secrets > /dev/null
            xvfb-run -a pnpm test
          '
      # Loop 051: both Railway images build from the repo root, and the api image
      # passes its production smoke (S1-S10) against Postgres and a fake Resend.
      - name: Build the www image
        run: docker build -f apps/www/Dockerfile -t skovern-www-smoke .
      - name: Build and smoke the api image
        run: |
          docker build -f apps/site/Dockerfile -t skovern-api-smoke .
          node apps/site/scripts/smoke-image.ts
      # Runs even when tests fail, so a red test step can't hide new advisories (it hid 8 until
      # 2026-10-23).
      - name: Dependency audit
        if: ${{ !cancelled() }}
        run: pnpm audit --prod --audit-level=high
