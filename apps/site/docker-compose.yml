# Local dev Postgres for the auth server. `pnpm --filter @skovern/site db:up`.
# Password is a well-known dev-only default — never used in a real deployment.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: skovern
      POSTGRES_PASSWORD: skovern
      POSTGRES_DB: skovern
    # Host port 5442 (not the crowded 5432) to avoid clashing with other local DBs.
    # Bind to loopback only — a dev DB must never be reachable from an untrusted network
    # (ledger compose-bind-localhost, origin 004).
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - skovern-pgdata:/var/lib/postgresql/data

volumes:
  skovern-pgdata:
