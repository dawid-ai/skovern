# Packaging config (loop 029). Produces a real installer per OS so a FRESH machine can
# install Skovern and run the embedded local brain with no dev tools / no Ollama.
#
# Windows is built + proven this loop; mac/linux config is authored here but built +
# validated on native runners in loop 030 (GitHub Actions release matrix) — native
# modules (node-llama-cpp) can't cross-compile from one OS.
appId: com.skovern.app
productName: Skovern
directories:
  output: dist
  buildResources: build

# electron-vite bundles the app into out/. We ship that + the package manifest;
# electron-builder pulls in the production node_modules (systeminformation,
# node-llama-cpp, electron-updater) automatically.
files:
  - out/**
  - package.json
  # electron-vite already inlines @skovern/core + plugin-sdk into out/main, so their raw
  # TS source (their package.json `main` points at ./src) would ride along redundantly —
  # first-party logic disclosure + bloat in a shipped installer. Drop it, plus test files
  # and dependency source maps (reverse-engineering aids, all upstream-public anyway).
  - "!**/@skovern/*/src/**"
  - "!**/*.test.*"
  - "!**/*.map"

# node-llama-cpp loads a NATIVE .node addon (in the per-platform @node-llama-cpp/*
# sub-package). A native binary can't be dlopen'd from inside app.asar, so it must be
# UNPACKED to app.asar.unpacked. Both the loader and every platform binary sub-package
# are unpacked; the correct one for the host OS is what actually loads.
# systeminformation needs NO unpack — it invokes system tools on PATH, not a bundled
# binary — but it must stay INCLUDED (it's a production dep, so it is).
asarUnpack:
  - "**/node_modules/node-llama-cpp/**"
  - "**/node_modules/@node-llama-cpp/**"

# The @node-llama-cpp/* binaries are prebuilt for the plain-Node ABI (the runtime child
# runs as ELECTRON_RUN_AS_NODE, not in the Electron process), so DON'T rebuild them
# against Electron's headers — that would break the ABI and need a C++ toolchain.
npmRebuild: false

win:
  target:
    - nsis
mac:
  target:
    - dmg
  category: public.app-category.productivity
linux:
  target:
    - AppImage
  category: Utility

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
